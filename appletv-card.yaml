type: custom:bubble-card
card_type: pop-up
hash: "#apple_tv"
margin_top_mobile: auto
margin_top_desktop: auto
tap_action:
  action: none
double_tap_action:
  action: none
hold_action:
  action: none
show_header: false
close_by_clicking_outside: false
backdrop_blur: "5"
bg_blur: "100"
bg_opacity: "50"
button_type: name
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
    background: rgba(255, 255, 255, 0.1); 
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: AppleTV (Гостиная)
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: phu:apple-tv
      - type: spacer
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:last-child$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: media_player.gostinaia
        picture: |
          {{state_attr(entity, 'entity_picture')}}
        tap_action:
          action: toggle
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: phu:apple-tv
        icon_color: "1"
        card_mod:
          style:
            .: |
              {% set scale = '1' %}
              {% set hover = '' %}
              {% set stating = 'true' %}
              {% set state_on = '' %}
              {% set color = 'rgba(120,120,120,0.2)' %}
              {% set hover_color_off = 'rgba(120,120,120,0.3) !important' %}
              {% include 'chip_settings_style.jinja' %}
    alignment: center
    card_mod:
      style:
        .: |
          ha-card {
             --chip-background: none !important;
             --chip-border-radius: 1000px;
             zoom: 6;
             #--chip-height: 200px;
             --chip-spacing: {{chip_spacing|default(0)}}px;
             margin: 2px;
             }
  - type: custom:mushroom-template-card
    features_position: bottom
    entity: media_player.gostinaia
    grid_options:
      columns: 12
      rows: auto
    tap_action:
      action: none
    vertical: true
    icon_tap_action:
      action: none
    primary: |-
      {% if is_state(config.entity, 'playing')%} 
        {% if is_state_attr(config.entity, 'app_id', 'com.apple.TVAirPlay') and state_attr(config.entity, 'media_title') == '' %} 
        {{state_attr(config.entity, 'app_name')}}
        {% else %} 
                 {% if state_attr(config.entity, 'media_title') == '' %}Без названия
                 {% else %} {{ state_attr(config.entity, 'media_title')|replace("!⃝","🔞")}}
                 {% endif %}
        {% endif %}
        {% else %}  TV
      {% endif %}
    secondary: |
      {% if is_state(config.entity, 'playing')%} 
        {% if is_state_attr(config.entity, 'app_id', 'ru.kinopoisk')%} Кинопоиск
        {% elif is_state_attr(config.entity, 'app_id', 'com.google.ios.youtube')%} YouTube
        {% elif is_state_attr(config.entity, 'app_id', 'com.apple.TVAirPlay')%} 
          {% if state_attr(config.entity, 'media_title') == '' %} Airplay
          {% else %} {{state_attr(config.entity, 'media_artist')}} 
          {% endif %}
        {% elif is_state_attr(config.entity, 'app_id', 'com.apple.TVWatchList')%} tv+
        {% elif is_state_attr(config.entity, 'app_id', 'com.apple.TVMusic')%}
                 {% if state_attr(config.entity, 'media_artist') == '' %} Music
                 {% else %} {{ state_attr(config.entity, 'media_artist')|truncate(100) }}
                 {% endif %}
        {% elif is_state_attr(config.entity, 'app_id', 'org.videolan.vlc-ios')%} VLC
        {% elif is_state_attr(config.entity, 'app_id', 'ru.ivi')%} Иви
        {% else %} Воспроизведение
        {% endif %}

      {% elif is_state(config.entity, 'off')%} Сон
      {% elif is_state(config.entity, 'paused')%} Пауза
      {% else %} Бездействие
      {% endif %}
    card_mod:
      style: |
        ha-card {
          zoom: 1.5;
          background: none;
        }
  - type: conditional
    conditions:
      - condition: state
        entity: media_player.gostinaia
        state_not: unavailable
      - condition: state
        entity: binary_sensor.appletv_media_progress
        state: "on"
    card:
      entity: media_player.homepod_mini_gost
      tap_action: none
      hide:
        icon: true
        name: true
        runtime: true
        source: true
        power: true
        state_label: true
        volume: true
        info: true
        progress: false
        controls: true
      more_info: false
      type: custom:mini-media-player
      toggle_power: false
      group: true
      volume_stateless: false
      card_mod:
        style:
          .: |
            ha-card {

              height: var(--mmp-progress-height);
              --mmp-accent-color: rgba(var(--rgb-primary-text-color),1);;
              --ha-card-border-width: 0;
              margin: 0px 30px; 
            }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: switch.apple_tv_switch
        grid_options:
          columns: 12
          rows: auto
        color: |-
          {% if is_state(config.entity, 'on')%} white
          {% else %} disabled
          {% endif %}
        icon_tap_action:
          action: none
        icon: mdi:power
        vertical: true
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.gostinaia
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:skip-previous
        tap_action:
          action: perform-action
          perform_action: media_player.media_previous_track
          target:
            entity_id: media_player.gostinaia
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.gostinaia
        grid_options:
          columns: 12
          rows: auto
        tap_action:
          action: perform-action
          perform_action: media_player.media_play_pause
          target:
            entity_id:
              - media_player.gostinaia
        vertical: true
        icon: |
          {% if is_state(entity, 'playing')%} fas:pause
          {% elif is_state(entity, 'paused')%} fas:play
          {% else %}fas:lock{% endif%}
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.gostinaia
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:skip-next
        tap_action:
          action: perform-action
          perform_action: media_player.media_next_track
          target:
            entity_id: media_player.gostinaia
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: light.embi_lampa
        grid_options:
          columns: 12
          rows: auto
        color: white
        tap_action:
          action: navigate
          navigation_path: "#apple_tv_remote"
        icon: phu:apple-tv-gen2-remote
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
  - type: custom:mushroom-media-player-card
    entity: media_player.gostinaia
    volume_controls:
      - volume_set
    layout: horizontal
    primary_info: none
    secondary_info: none
    icon_type: none
    card_mod:
      style:
        mushroom-media-player-volume-control$: |
          mushroom-slider {
            --main-color: #505050 !important;
            --bg-color: #50505055 !important;
            --control-height: 25px !important;
          }
        .: |
          ha-card {
            background: transparent !important;
            opacity: 100%;
            margin: 0px 20px !important; 
            border-width: 0px;
            margin: 0px 0px 0px;
          }
    visibility:
      - condition: state
        state_not: unavailable
      - condition: state
        state_not: standby
popup_mode: default
card_layout: large
slide_to_close_distance: "500"
