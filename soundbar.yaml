type: custom:bubble-card
card_type: pop-up
hash: "#soundbar"
margin_top_mobile: auto
margin_top_desktop: auto
show_header: false
close_by_clicking_outside: false
backdrop_blur: "5"
bg_blur: "100"
bg_opacity: "50"
button_type: name
bg_color: "#000"
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
    background: rgba(255, 255, 255, 0.1);
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: Samsung HW-B550
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: ""
      - type: spacer
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:nth-child(3)$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mushroom-media-player-card
    entity: media_player.samsung
    volume_controls:
      - volume_set
    layout: horizontal
    primary_info: none
    secondary_info: none
    icon_type: none
    card_mod:
      style:
        mushroom-media-player-volume-control$: |
          mushroom-slider {
            --main-color: #505050 !important; 
            --bg-color: #50505055 !important;
            --control-height: 25px !important;

          }
        .: |
          ha-card {
            background: transparent !important;
            border-width: 0px;
              }
          @media (pointer: fine) {
            ha-card:hover {
              background: {{(states('input_text.s_card_background_off_hover')) }};
          }
    grid_options:
      columns: 12
      rows: auto
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:volume-mute
        tap_action:
          action: perform-action
          perform_action: remote.send_command
          target:
            entity_id: remote.universal_remote
          data:
            num_repeats: 1
            delay_secs: 0.4
            hold_secs: 0
            command: mute
            device: b550
        vertical: true
        icon_tap_action:
          action: none
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-empty-card
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.yandex_station_purple
        grid_options:
          columns: 12
          rows: auto
        tap_action:
          action: perform-action
          perform_action: remote.send_command
          target:
            entity_id: remote.universal_remote
          data:
            num_repeats: 1
            delay_secs: 0.4
            hold_secs: 0
            command: up
            device: b550
        vertical: true
        color: white
        icon: mdi:circle-small
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-empty-card
      - type: custom:mushroom-template-card
